[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-api"
version = "0.1.1"
description = "Kyrian World core API: auth, users, trips and conversations on DynamoDB"
requires-python = ">=3.12"
dependencies = [
    "travel-common",
    "fastapi[standard]>=0.141.1",
    # Only for `copy-from-postgres` (core_api/legacy_sql); removed in TRA-219.
    "sqlalchemy>=2.0.52",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "httpx>=0.28.1",
]

[tool.uv.sources]
travel-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["core_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
