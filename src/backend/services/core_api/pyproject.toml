[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-api"
version = "0.1.1"
description = "Kyrian World core API: auth, users, trips and the access list on DynamoDB"
requires-python = ">=3.12"
dependencies = [
    "travel-common",
    "fastapi>=0.141.1",
    # uvicorn picks these up on its own (`--loop auto`, `--http auto`): the
    # event loop and HTTP parser production has always run. Not the
    # [standard] extra, whose websockets, watchfiles and pyyaml never run here.
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0; sys_platform != 'win32' and sys_platform != 'cygwin' and platform_python_implementation != 'PyPy'",
    "httptools>=0.8.0",
    "email-validator>=2.3.0",
    "httpx>=0.28.1",
]

[tool.uv.sources]
travel-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["core_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
