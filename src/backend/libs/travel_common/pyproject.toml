[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel-common"
version = "0.1.1"
description = "Code shared by every Travel AI World service: identity, settings, errors, HTTP scaffolding"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["travel_common"]
