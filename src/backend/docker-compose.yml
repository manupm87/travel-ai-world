# Local stack: PostgreSQL + core_api + ai_api behind one nginx origin.
#
#   just docker-up          (or: docker compose --env-file services/core_api/.env up --build -d)
#   http://localhost:8080   -> proxy (what the frontend should use)
#   http://localhost:8000   -> core_api directly
#   http://localhost:8001   -> ai_api directly
#
# Each service reads its own .env (copy the .env.example next to it).
# SECRET_KEY must be identical in both. The ${DB_*} values below are
# interpolated by Compose, so pass --env-file services/core_api/.env (as
# `just docker-up` does) to keep PostgreSQL and core_api on the same credentials.
# PostgreSQL itself receives only those three values, never the service's .env
# (which holds SECRET_KEY and the Google client secret).

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      core_api:
        condition: service_healthy
      ai_api:
        condition: service_healthy
    restart: unless-stopped

  core_api:
    build:
      context: .
      args:
        SERVICE: core_api
    image: travel-ai-world/core-api:local
    env_file: services/core_api/.env
    environment:
      - DB_SERVER=db_postgres
    ports:
      - "8000:8000"
    depends_on:
      db_postgres:
        condition: service_healthy
    restart: unless-stopped

  ai_api:
    build:
      context: .
      args:
        SERVICE: ai_api
    image: travel-ai-world/ai-api:local
    env_file: services/ai_api/.env
    environment:
      - CORE_API_URL=http://core_api:8000
    ports:
      - "8001:8000"
    restart: unless-stopped

  db_postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
