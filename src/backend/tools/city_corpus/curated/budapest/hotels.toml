# Budapest — hotel photos read by hand (TRA-211).
#
# Every entry was opened in a browser on the hotel's own group site (or, where the
# group refuses every automated client, on Wikimedia Commons) and the picture the
# hotel shows of itself was taken from that page. Never a reseller.
#
# Looked at and left out, with the reason the report gives and what was found:
#
#   Barceló Budapest              — OpenStreetMap's website tag points at an unrelated
#                                   site (parkresidence.eu); barcelo.com answers 403 to
#                                   every non-browser client and to this browser too.
#   Crowne Plaza                  — ihg.com answers 403 to the browser as well.
#   Hilton Budapest City          — hilton.com answers 403; nothing on Commons at its
#                                   coordinates.
#   Hilton Garden Inn Budapest    — hilton.com answers 403; nothing on Commons.
#   Mercure Korona Hotel          — the same hotel as `Mercure Budapest Korona` below,
#                                   listed twice by OpenStreetMap and Wikivoyage under
#                                   two names and one Accor page. It keeps the picture
#                                   its own site publishes; this file pictures the other
#                                   document, so the two cards do not share one image.
#   NH Budapest City              — nh-hotels.com answers 403; nothing on Commons.
#   Park Inn By Radisson          — radissonhotels.com answers 403.
#   St. Regis                     — marriott.com answers 403. The Commons files at its
#                                   coordinates are of the Klotild palaces as a pair and
#                                   do not say which of the two the hotel occupies.
#   ibis Budapest Aero            — no Accor page answers to that name any more; the
#                                   hotel may have been renamed or closed, and a picture
#                                   of a different ibis would be a lie.
#   ibis Budapest Stadium         — the same.

