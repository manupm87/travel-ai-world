# Budapest tours, maintained by hand (TRA-154). See ../../README.md, "Tours file".
#
# Every fact below was read on the operator's own website on the `checked` date;
# summaries are our own words. Only public, scheduled tours with a published meeting
# point, schedule, duration and language are listed. Deliberately not here:
#   * Strawberry Tours - the meeting point is only sent after booking.
#   * Generation Tours - its own site publishes no schedule (it links to freetour.com).
#   * freetourbudapest.eu - contradictory, partly templated pages.
#   * Walkative! and SANDEMANs - resellers: their Budapest tours are run by
#     Trip to Budapest and Go Zeppelin, which are listed below.
# Meeting point coordinates come from OpenStreetMap (Nominatim) for the landmark the
# operator names, not from the operator.

[[tour]]
id = "trip-to-budapest-pest"
name = "Free Budapest Tour"
operator = "Trip to Budapest"
operator_url = "https://www.triptobudapest.hu/"
url = "https://www.triptobudapest.hu/tour/free-budapest-tour/"
tour_type = "walking"
price_model = "tip-based"
summary = """
First-day introduction to the Pest side, about 3.5 km on foot. It runs from Erzsébet \
tér past St Stephen's Basilica, Vörösmarty tér and Váci Street to the Danube \
promenade, the Academy of Sciences and the Shoes on the Danube memorial, ending at \
the Parliament."""
meeting_point = "Erzsébet tér, in the park by the Budapest Eye, next to the Danubius fountain (look for the blue FREE TOUR sign)"
address = "Erzsébet tér, 1051 Budapest"
lat = 47.498212
lon = 19.051996
start_times = ["10:30", "16:30"]
days = "daily"
duration_minutes = 120
languages = ["English"]
booking_required = true
checked = 2026-09-17
notes = """
The tour page's FAQ says booking is required; the homepage says it is recommended but \
not mandatory. Runs from 5 participants; groups of 8 or more must contact the \
operator 24 h ahead. Resold by Walkative! as "Budapest Pest & Danube Free Walking Tour"."""

[[tour]]
id = "trip-to-budapest-buda-castle"
name = "Free Buda Castle Tour"
operator = "Trip to Budapest"
operator_url = "https://www.triptobudapest.hu/"
url = "https://www.triptobudapest.hu/tours/free-buda-castle-tour/"
tour_type = "walking"
price_model = "tip-based"
summary = """
Climb from the Buda riverbank into the Castle District for its medieval and royal \
history. Stops include St Anne's Church, Fisherman's Bastion, Holy Trinity Square and \
Matthias Church, the Hospital in the Rock, the old Jewish quarter of the hill and the \
Tóth Árpád promenade, ending at the Royal Palace."""
meeting_point = "Batthyány tér, about 30 m from the metro exit in the middle of the square (look for the blue FREE TOUR flag)"
address = "Batthyány tér, 1011 Budapest"
lat = 47.506872
lon = 19.037782
start_times = ["10:30", "14:30"]
days = "daily at 10:30; Thursday to Sunday also at 14:30"
duration_minutes = 120
languages = ["English"]
booking_required = true
checked = 2026-09-17
notes = "Booking is not stated on this page; Walkative!, which resells it, calls booking obligatory."

[[tour]]
id = "trip-to-budapest-communism"
name = "Free Communism Tour"
operator = "Trip to Budapest"
operator_url = "https://www.triptobudapest.hu/"
url = "https://www.triptobudapest.hu/tours/communist-tour-budapest/"
tour_type = "walking"
price_model = "tip-based"
summary = """
A short walk, closer to a lecture, about daily life under the post-war regime and how \
it is remembered. It covers Liberty Square and its competing monuments, a hidden \
bunker exit, the last Soviet memorial in the centre and sites of the 1956 uprising, \
ending near the Parliament."""
meeting_point = "Erzsébet tér, in the park by the Budapest Eye, next to the Danubius fountain (look for the FREE TOUR sign)"
address = "Erzsébet tér, 1051 Budapest"
lat = 47.498212
lon = 19.051996
start_times = ["15:30"]
days = "Tuesday and Saturday"
duration_minutes = 120
languages = ["English"]
booking_required = true
checked = 2026-09-17
notes = """
Operator says 1.5-2 hours (~2 km); the longer figure is recorded. The page gives the \
season start as 31 March without a year, so the winter schedule is unclear."""

