# Documents from the other sources that are tours, or that the automatic rule wrongly
# takes for tours. Checked against the corpus on 2026-09-17.
[reclassify]
include = [
    # Danube dinner cruises and a wine-tasting cruise, listed under Do and Drink.
    { doc_id = "wv:en:Budapest#do:hungaria-koncert", tour_type = "boat" },
    { doc_id = "wv:en:Budapest/Belváros#drink:wine-tasting-on-boat", tour_type = "boat" },
    # Sightseeing boat operator, mapped in OSM as an attraction.
    { doc_id = "osm:node/4561975612", tour_type = "boat" },
    # Guided rides on Margaret Island, listed under Get around.
    { doc_id = "wv:en:Budapest/Angyalföld#transport:horse-drawn-chariot", tour_type = "other" },
    { doc_id = "wv:en:Budapest/Angyalföld#transport:small-train", tour_type = "other" },
    # Bike rental that also runs guided city rides.
    { doc_id = "wv:en:Budapest/Terézváros#do:yellow-zebra-bikes", tour_type = "bike" },
]
exclude = [
    # A protected hiking area, filed by Wikivoyage under a "Walking tours" heading.
    "wv:en:Budapest/Hegyvidék#do:buda-protected-landscape-area",
]
