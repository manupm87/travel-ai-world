# Berlin — hotel photos read by hand (TRA-211).
#
# Every entry was opened in a browser on the hotel's own group site and the picture
# the hotel shows of itself was taken from that page. Never a reseller — and note
# that OpenStreetMap's `website` tag is a booking.com link for several Berlin
# hotels, which is why the build finds a page and no photograph.
#
# Looked at and left out, with the reason the report gives and what was found:
#
#   B&B Hotel × 6                 — hotel-bb.com and hotelbb.de answer 403 to every
#                                   automated client, this browser included; the rest
#                                   carry a booking.com link as their website.
#   Best Western × 3              — two have no website tag at all and the third's is
#                                   a booking.com link.
#   Courtyard by Marriott × 2,    — marriott.com answers 403 to the browser as well.
#   JW Marriott Hotel Berlin        Nothing on Commons at their coordinates.
#   DoubleTree by Hilton Ku'damm  — hilton.com answers 403.
#   Holiday Inn, Hotel Indigo × 4 — ihg.com answers 403; the `hotelindigoberlin.com`
#                                   pages OpenStreetMap points at publish no picture.
#   Mercure Hotel Berlin Mitte    — its Accor page (hotel 4988) answers 410 Gone: the
#                                   house has closed or been rebranded, and the
#                                   photograph still on Accor's CDN would be a lie.
#   Meininger Tempelhofer Ufer    — no page on meininger-hotels.com any more; the
#                                   group's Berlin houses are Central Station, Mitte,
#                                   Airport and East Side Gallery.
#   Motel One × 5                 — the group's image host answers 400 to a `HEAD`,
#                                   so no picture of theirs can be checked at build
#                                   time, curated or not.
#   NH × 7                        — nh-hotels.com and nh-hotels.de answer 403; the
#                                   others have no website tag.
#   Novotel, ibis Styles × 3,     — no website tag in OpenStreetMap and no Accor page
#   ibis Berlin City Nord           that can be matched to the name with confidence.
#   Premier Inn × 3, Scandic × 2  — premierinn.com and scandichotels.com answer 403.
#   Radisson Blu, Radisson        — radissonhotels.com answers 403, and the Commons
#   Collection                      files at their coordinates are all of the AquaDom,
#                                   the lobby aquarium that burst in December 2022.
#   Steigenberger                 — OpenStreetMap names it "Steigenberger" and points
#                                   at a page that is gone; the group's Berlin houses
#                                   cannot be told apart from that.
#   Leonardo Hotel Berlin         — no website tag, and Leonardo runs several houses
#                                   in Berlin under names too close to guess between.
#   art'appart, Campanile, TRYP,  — dead domains, and nothing on Commons.
#   Park Plaza Wallstreet

