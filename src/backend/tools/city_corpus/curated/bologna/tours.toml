[[tour]]
id = "secret-food-tours-bologna"
name = "Secret Food Tours: Bologna"
operator = "Secret Food Tours"
operator_url = "https://www.secretfoodtours.com/"
url = "https://www.secretfoodtours.com/bologna/food-tours-bologna/"
tour_type = "food"
price_model = "paid"
summary = """
A three-and-a-half-hour eating walk through the Quadrilatero market district and the \
university quarter: six or seven stops with fresh pasta, mortadella and other cured \
