people. About 90 EUR per person."""
meeting_point = "Via Zamboni 8c, in front of the Pokè Bowl Station (the guide carries an orange umbrella)"
address = "Via Zamboni 8c, 40126 Bologna"
lat = 44.495045
lon = 11.347340
start_times = ["10:30", "15:00"]
days = "Monday to Saturday"
duration_minutes = 210
languages = ["English"]
booking_required = true
checked = 2026-09-19
notes = """
The operator also sells a shorter "Express Food Tour" (about 2 hours, four stops, \
about 70 EUR) from the same area; its page publishes no separate schedule, so it is \
not listed. Bookings only on the operator's site."""

