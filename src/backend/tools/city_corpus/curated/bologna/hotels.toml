# Bologna — hotel photos read by hand.
#
# On 2026-10-19 every hotel whose automatic picture looked wrong (a screenshot, a logo,
# a promotion, the city instead of the hotel) was opened in a browser. The entries
# below replace the picture with one the hotel shows of itself on its own site, or
# take the hotel out when no such picture exists.
#
# Looked at and kept as the build finds them: Hotel Michelino (lounge), The Sydney
# Hotel (façade), Hotel Palace (entrance), Hotel Marconi Express (lobby, with the
# site's caption over it), B&B Il Moscondoro (a collage of its room and portico) and
# Grand Hotel Majestic (the Carracci room, a Commons file by the hotel's account).
#
# Left out by the build, not looked at again: AC Hotel Bologna and Best Western City
# Hotel have no website tag in OpenStreetMap.

