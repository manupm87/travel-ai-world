# Madrid — hotel photos read by hand (TRA-211).
#
# Every entry was opened in a browser on the hotel's own site, or — where the group
# refuses every automated client and the building is a landmark in its own right —
# on Wikimedia Commons, where the file's title and its geotag say which house it is.
# Never a reseller.
#
# Looked at and left out, with the reason the report gives and what was found:
#
#   AC Hotel × 5, Madrid Marriott  — marriott.com, achotels.marriott.com and
#   × 2, Atocha Tapestry, DoubleTree  espanol.marriott.com, hilton.com and ihg.com all
#   Prado, Hilton Madrid Airport,     answer 403 to every automated client, this browser
#   Spark by Hilton, Crowne Plaza     included. Nothing usable on Commons at their
#   × 2, Hotel Indigo Princesa        coordinates either.
#   NH × 12, NH Collection × 3     — nh-hotels.com and nh-hoteles.es answer 403; the
#                                    rest have no website tag in OpenStreetMap.
#   Barceló Emperatriz, Barceló    — barcelo.com answers 403, and unlike the Torre de
#   Imagine                          Madrid these two are ordinary buildings with
#                                    nothing of them on Commons.
#   B&B Hotel × 4                  — hotel-bb.com answers 403; two of the four have
#                                    dead domains.
#   Catalonia × 6                  — the `hoteles-catalonia.com` URLs OpenStreetMap
#                                    carries are dead, and the group's current pages
#                                    illustrate every hotel with the same brand
#                                    photographs (an "about us" header, a numbered
#                                    room), which say nothing about the house.
#   H10 Puerta de Alcalá, H10      — no website tag, and h10hotels.com shows the
#   Tribeca                          group's campaign pictures above the fold.
#   Meliá Serrano, Best Western    — no website tag, or a 403.
#   Los Condes, Ibis Budget
#   Vallecas, Aparthotel NH La
#   Florida

