# OSM district name (the boundaries carry no `ref` tag) → the Wikivoyage guide(s) covering it.
[district_guides]
# From the Districts section of en.wikivoyage.org/wiki/Berlin: eight guides for
# twelve Bezirke. Mitte (Mitte and Tiergarten; Moabit and the Hansaviertel are
# in City West, Wedding in East Central), Pankow (Prenzlauer Berg is East
# Central, Weissensee and Pankow East) and Tempelhof-Schoeneberg (Schoeneberg and
# Friedenau are City West) are split; the nearest Wikivoyage listing decides.
"Charlottenburg-Wilmersdorf" = ["City West"]
"Friedrichshain-Kreuzberg" = ["East Central"]
"Lichtenberg" = ["East"]
"Marzahn-Hellersdorf" = ["East"]
"Mitte" = ["Mitte", "City West", "East Central"]
"Neukölln" = ["Tempelhof and Neukölln"]
"Pankow" = ["East Central", "East"]
"Reinickendorf" = ["Reinickendorf and Spandau"]
"Spandau" = ["Reinickendorf and Spandau"]
"Steglitz-Zehlendorf" = ["Steglitz-Zehlendorf"]
"Tempelhof-Schöneberg" = ["City West", "Tempelhof and Neukölln"]
"Treptow-Köpenick" = ["Treptow-Köpenick"]
