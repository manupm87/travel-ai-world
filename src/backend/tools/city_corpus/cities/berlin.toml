# Berlin (Wikidata Q64), drafted by `python -m city_corpus discover "Berlin"` and
# checked by hand (TRA-33). Budapest is the commented reference.

slug = "berlin"
name = "Berlin"
aliases = ["berlin", "berlín"]
language = "en"
wikipedia_lang = "en"
# OpenStreetMap relation of the city (Wikidata P402): selects the area for the boundaries and the place queries.
osm_relation = 62422
# Only used when `osm_relation` is unset.
osm_area = "Berlin"
# The country the planner names on a trip, and its ISO 3166-1 alpha-2 code.
country = "Germany"
country_code = "DE"
district_admin_level = 9
centre = [52.5167, 13.3833]
timezone = "Europe/Berlin"
# Wikidata districts (P150): Bezirk Mitte (Q163966), Charlottenburg-Wilmersdorf (Q158095), Friedrichshain-Kreuzberg (Q158893), Lichtenberg (Q329609), Marzahn-Hellersdorf (Q119284), Neukölln (Q4071168), Pankow (Q163012), Reinickendorf (Q158876), Spandau (Q158083), Steglitz-Zehlendorf (Q158064), Tempelhof-Schöneberg (Q158106), Treptow-Köpenick (Q158089)
districts = [
    "City West",
    "East",
    "East Central",
    "Mitte",
    "Reinickendorf and Spandau",
    "Steglitz-Zehlendorf",
    "Tempelhof and Neukölln",
    "Treptow-Köpenick",
]

# From OSM relation 62422 (Nominatim), rounded outwards.
[bbox]
south = 52.33
west = 13.08
north = 52.68
east = 13.77

# The city's photo, shown on the trip overview: a Commons file (Wikidata P18,
# licence checked on Commons 2026-09-21: the skyline from the Victory Column,
# Reichstag, TV tower, cathedral and Brandenburg Gate) and the credit the page prints.
[hero]
file = "Cityscape Berlin.jpg"
credit = "Thomas Wolf, www.foto-tw.de (CC BY-SA 3.0) · Wikimedia Commons"

[[wikivoyage]]
lang = "en"
root = "Berlin"
include_subpages = true  # 8 district pages

[[wikivoyage]]
lang = "es"
root = "Berlín"
include_subpages = false  # no district pages

# The Spanish lead of every article, for questions asked in Spanish: the
# Spanish Wikivoyage has no district pages, so the corpus had little else.
# Excluded: what the broad categories file next to the sights that a traveller
# does not visit (embassies, institutes, a prison, transmitters, archives).
[wikipedia]
leads = ["es"]
exclude = [
    "Artemis (brothel)",
    "Arthur Löwenstamm",
    "Berlin-Britz transmitter",
    "Berlin-Tegel radio transmitter",
    "Betahaus",
    "Bibliothek des Konservatismus",
    "Bundeshaus (Berlin)",
    "Campus Berlin-Buch",
    "Corps Berlin",
    "Embassy of Belarus, Berlin",
    "Embassy of Turkey, Berlin",
    "Embassy of the United Arab Emirates, Berlin",
    "Embassy of the United Kingdom, Berlin",
    "Friedrich-von-Raumer-Bibliothek",
    "Hakenfelde Prison",
    "ILA Berlin Air Show",
    "Julius Leber Barracks (Berlin)",
    "Landgericht Berlin",
    "Leibniz-Forschungsinstitut für Molekulare Pharmakologie",
    "List of castles in Berlin and Brandenburg",
    "Max Planck Institute for Infection Biology",
    "Power station Berlin-Wilmersdorf",
    "Program (German non-profit)",
    "Proletarian Theatre, Stage of the Revolutionary Workers of Greater Berlin",
    "Prussian Heritage Image Archive",
    "Representation of the European Commission in Germany",
    "Research Institutes for Experimental Medicine",
    "Steinway Hall",
    "Tegel Prison",
    "Transmitter Stallupöner Allee, Berlin",
    "Unfallkrankenhaus Berlin",
    "WZB Berlin Social Science Center",
    "Zentralarchiv der Staatlichen Museen zu Berlin",
]

