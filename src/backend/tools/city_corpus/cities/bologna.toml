# OSM district name (the boundaries carry no `ref` tag) → the Wikivoyage guide(s) covering it.
[district_guides]
"Borgo Panigale-Reno" = ["Borgo Panigale-Reno"]
"Porto-Saragozza" = ["Porto-Saragozza"]
"Quartiere Navile" = ["Quartiere Navile"]
"San Donato-San Vitale" = ["San Donato-San Vitale"]
"Santo Stefano" = ["Santo Stefano"]
"Savena" = ["Savena"]
