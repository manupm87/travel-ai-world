# Bologna has no `Churches in Bologna`; its churches are basilicas and its
# architecture categories hold most of the palaces and sights (probed by hand
# on 2026-09-19, counts as of that day).
# 9 pages
[[wikipedia.categories]]
name = "Basilica churches in Bologna"

# 9 pages
