# One public origin, the same shape as CloudFront in production
# (infra/aws/frontend.tf: S3 export at "/", API Gateway behind "/api/*").
#
#   /api/v1/ai/*  -> ai_api   (SSE: buffering off, long read timeout)
#   /api/*        -> core_api
#   everything    -> the frontend's static export (src/frontend/out, bind-mounted
#                    read-only at /usr/share/nginx/html by docker-compose.yml;
#                    without a build, "/" answers 404 and the API still works)

upstream core_api { server core_api:8000; }
upstream ai_api   { server ai_api:8000; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/ai/ {
        proxy_pass http://ai_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://core_api;
    }

    # Static export (next.config.ts: output "export", trailingSlash true, so
    # every page is <route>/index.html). Same mapping as the CloudFront
    # "directory_index" function: /dashboard/ and /dashboard -> /dashboard/index.html.
    # Anything else is Next's not-found page with a real 404 status, including a
    # directory without index.html such as /trip/ (nginx would say 403 otherwise).
    # error_page is not applied to proxied responses: proxy_intercept_errors is off.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        error_page 404 /404.html;
        error_page 403 =404 /404.html;
    }

    # Hashed build assets are immutable; HTML stays uncached so a new export shows up.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
