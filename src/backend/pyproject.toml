# Workspace root. Members: libs/* (shared libraries), services/* (deployable APIs)
# and tools/* (scripts that share the toolchain but are not deployed, e.g. the scraper).
# One lockfile and one virtualenv for the whole backend: `uv sync` at this level
# installs every member; `uv sync --package core-api` installs only one.
[project]
name = "travel-backend"
version = "0.1.1"
description = "Travel AI World backend workspace"
requires-python = ">=3.12"
dependencies = ["travel-common", "core-api", "ai-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*", "tools/*"]

[tool.uv.sources]
travel-common = { workspace = true }
core-api = { workspace = true }
ai-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "httpx>=0.28.1",
    "pyright>=1.1.411",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".git", "__pycache__", "alembic", ".venv"]

[tool.ruff.lint]
# Explicit rule set so a linter upgrade never silently changes the policy.
#   I  import order      UP modern syntax      B  bugbear          SIM simplify
#   N  pep8 naming       RUF ruff-specific     ASYNC async pitfalls   S  bandit
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "N", "RUF", "ASYNC", "S"]
ignore = [
    "B008",  # FastAPI wiring: Depends()/Query() calls in parameter defaults
    "N818",  # domain errors are named after the condition (Forbidden), not *Error
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # asserts and fake secrets are what tests are made of
# The scraper is maintained separately and keeps the original E/F-only policy.
"tools/**" = ["I", "UP", "B", "SIM", "N", "RUF", "ASYNC", "S"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["sqlalchemy.orm.declared_attr"]

[tool.pyright]
include = ["libs/travel_common/travel_common", "services/core_api/core_api", "services/ai_api/ai_api"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Each member has its own `tests/`; importlib mode keeps them from colliding.
addopts = "--import-mode=importlib"
testpaths = ["libs/travel_common/tests", "services/core_api/tests", "services/ai_api/tests"]
