# Link checker config for the `docs` CI job.
exclude = [
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://[^/]*example\\.com",
  "^https?://[^/]*amazonaws\\.com",
  "^https?://console\\.cloud\\.google\\.com",
  "^https?://build\\.nvidia\\.com",
  "^https?://linear\\.app",
]
exclude_path = ["node_modules", ".venv", "src/frontend/out", "src/frontend/.next"]
accept = [200, 203, 206, 429]
max_concurrency = 8
