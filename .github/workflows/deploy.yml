name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual deploys from the Actions tab
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions needed by the Pages deploy action
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; cancel any in-progress run
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-frontend

      - name: Build (static export)
        working-directory: src/frontend
        env:
          # Project GitHub Pages URL: https://<owner>.github.io/<repo>/
          # The basePath is the repo name, derived so a fork or rename keeps working.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          NODE_ENV: production

        run: npm run build
        # Output lands in src/frontend/out/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
