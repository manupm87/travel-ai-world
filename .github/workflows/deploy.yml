name: Deploy frontend

# Builds the static export and syncs it to the private S3 bucket behind
# CloudFront (infra/aws/frontend.tf), then invalidates the distribution.
# The API is on the same domain (CloudFront /api/* → API Gateway), so the
# build points NEXT_PUBLIC_API_URL at the site itself: no CORS involved.
#
# Repository variables: FRONTEND_DOMAIN (the site and bucket name),
# CLOUDFRONT_DISTRIBUTION_ID (terraform output), COGNITO_DOMAIN and
# COGNITO_CLIENT_ID (terraform outputs cognito_domain / cognito_client_id).
# Secrets: AWS_REGION, AWS_ROLE_TO_ASSUME (bootstrap output ci_role_arn; the
# role trusts the `aws` environment only).

on:
  push:
    branches:
      - main
    paths:
      - "src/frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and sync to S3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aws
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-frontend

      - name: Build (static export)
        working-directory: src/frontend
        env:
          NEXT_PUBLIC_API_URL: https://${{ vars.FRONTEND_DOMAIN }}
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          # Only for the Google button, which the Cognito build does not show.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          NODE_ENV: production
        run: |
          test -n "${{ vars.FRONTEND_DOMAIN }}" || { echo "::error::Set the repository variable FRONTEND_DOMAIN"; exit 1; }
          npm run build

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync the export to S3
        run: |
          aws s3 sync src/frontend/out "s3://${{ vars.FRONTEND_DOMAIN }}" --delete \
            --cache-control "public, max-age=300"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
