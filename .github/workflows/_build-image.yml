name: Build backend image

# Reusable: the one place that knows how a backend image is built.
#   pr.yml            calls it with push=false (build, load, smoke-test)
#   backend-images.yml calls it with push=true  (build, push to GHCR)

on:
  workflow_call:
    inputs:
      service:
        description: Import package of the service (core_api | ai_api)
        type: string
        required: true
      push:
        description: Push to GHCR (false = build and smoke-test only)
        type: boolean
        default: false

# Permissions are inherited from the caller: pr.yml grants read-only (the
# image is only loaded), backend-images.yml grants packages: write.
jobs:
  image:
    name: ${{ inputs.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (dashes, lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/$(echo '${{ inputs.service }}' | tr _ -)" >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build${{ inputs.push && ' and push' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: src/backend
          file: src/backend/Dockerfile
          build-args: SERVICE=${{ inputs.service }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ inputs.push && steps.meta.outputs.tags || format('{0}:pr', inputs.service) }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Image imports its app
        if: ${{ !inputs.push }}
        run: docker run --rm --entrypoint python -e SECRET_KEY=x ${{ inputs.service }}:pr -c "from ${{ inputs.service }}.main import app; print('ok')"

      # core_api runs migrations at start and needs a database; its tests job
      # covers it. ai_api has no dependencies, so the container is started.
      - name: Image serves its health endpoint
        if: ${{ !inputs.push && inputs.service == 'ai_api' }}
        run: |
          docker run -d --name ai -p 8000:8000 -e SECRET_KEY=ci-secret ai_api:pr
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/api/v1/ai/health/ && break
            sleep 1
          done
          docker logs ai
          curl -fsS http://localhost:8000/api/v1/ai/health/
