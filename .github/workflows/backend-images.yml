name: Backend images

# Publishes one image per backend service to GHCR on every push to main that
# touches the backend. Terraform (infra/*) consumes these tags; nothing is
# deployed from here. How an image is built lives in _build-image.yml.

on:
  push:
    branches: [main]
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-images.yml"
      - ".github/workflows/_build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: ${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service: [core_api, ai_api]
    uses: ./.github/workflows/_build-image.yml
    with:
      service: ${{ matrix.service }}
      push: true
