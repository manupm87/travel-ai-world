name: Deploy backend

# Promotes the images built by backend-images.yml (GHCR) into the chosen
# cloud's registry and applies that cloud's Terraform with them. On AWS the
# functions receive the image *digests* (a mutable tag would not redeploy
# them) and, after the apply, core_api is invoked with {"command": "migrate"}.
#
# Prerequisites (one-off, per cloud):
#   - A remote Terraform state backend: for AWS, apply infra/aws/bootstrap once
#     (state bucket + GitHub OIDC provider + CI role); for GCP, a GCS bucket in
#     infra/gcp/versions.tf. CI cannot own local state.
#   - The container registry already created (first run only), because the
#     images are copied before Terraform applies:
#       terraform apply -target=google_artifact_registry_repository.backend  (GCP)
#       terraform apply -target=aws_ecr_repository.services                 (AWS)
#   - Repository secrets (see docs/runbooks/deploy.md and infra/README.md):
#       GCP: GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
#       AWS: AWS_REGION, AWS_ROLE_TO_ASSUME (bootstrap output ci_role_arn)
#     Repository variables (Settings → Variables): GCP_REGION (e.g. europe-west1),
#       AWS_TF_STATE_BUCKET (bootstrap output state_bucket),
#       FRONTEND_DOMAIN (AWS: TF_VAR_domain_name; the bucket has the same name)
#     Environment secrets (Settings → Environments → aws / gcp → Secrets), only
#     the real secrets:
#       both: TF_VAR_db_password, TF_VAR_nvidia_api_key, TF_VAR_google_client_secret;
#       GCP only: TF_VAR_secret_key
#     They must match what the state was applied with: a missing one arrives
#     as an empty string and the plan resets that value (TRA-133). Non-secret
#     inputs are defaults in infra/aws/variables.tf; GCP, which has none, reads
#     TF_VAR_google_client_id and TF_VAR_backend_cors_origins from the gcp
#     environment's variables.
#
# `apply=false` (default) only plans, so the workflow is safe to try.

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Target cloud
        type: choice
        options: [gcp, aws]
        required: true
      image_tag:
        description: GHCR tag to deploy (a commit SHA from backend-images, or "latest")
        type: string
        default: latest
      apply:
        description: Apply the plan (false = plan only)
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: deploy-backend-${{ inputs.cloud }}
  cancel-in-progress: false

env:
  GHCR_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: ${{ inputs.cloud }} (${{ inputs.apply && 'apply' || 'plan' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.cloud }}
    defaults:
      run:
        working-directory: infra/${{ inputs.cloud }}
    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
      TF_VAR_nvidia_api_key: ${{ secrets.TF_VAR_nvidia_api_key }}
      TF_VAR_secret_key: ${{ secrets.TF_VAR_secret_key }}
      TF_VAR_google_client_secret: ${{ secrets.TF_VAR_google_client_secret }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── GCP ──────────────────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        if: inputs.cloud == 'gcp'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: inputs.cloud == 'gcp'
        uses: google-github-actions/setup-gcloud@v3

      - name: Registry target (GCP)
        if: inputs.cloud == 'gcp'
        env:
          REGION: ${{ vars.GCP_REGION }}
        run: |
          test -n "$REGION" || { echo "::error::Set the repository variable GCP_REGION"; exit 1; }
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          echo "REGISTRY=${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/travel-ai-images" >> "$GITHUB_ENV"
          echo "TF_VAR_project_id=${{ secrets.GCP_PROJECT_ID }}" >> "$GITHUB_ENV"
          echo "TF_VAR_region=${REGION}" >> "$GITHUB_ENV"
          # Not secrets, and GCP has no defaults for them (AWS does: variables.tf).
          echo "TF_VAR_google_client_id=${{ vars.TF_VAR_google_client_id }}" >> "$GITHUB_ENV"
          echo "TF_VAR_backend_cors_origins=${{ vars.TF_VAR_backend_cors_origins }}" >> "$GITHUB_ENV"

      # ── AWS ──────────────────────────────────────────────────────────────
      - name: Authenticate to AWS
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Registry target (AWS)
        if: inputs.cloud == 'aws'
        env:
          STATE_BUCKET: ${{ vars.AWS_TF_STATE_BUCKET }}
        run: |
          test -n "$STATE_BUCKET" || { echo "::error::Set the repository variable AWS_TF_STATE_BUCKET (infra/aws/bootstrap output state_bucket)"; exit 1; }
          echo "TF_INIT_ARGS=-backend-config=bucket=${STATE_BUCKET} -backend-config=region=${{ secrets.AWS_REGION }}" >> "$GITHUB_ENV"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          echo "TF_VAR_region=${{ secrets.AWS_REGION }}" >> "$GITHUB_ENV"
          echo "TF_VAR_domain_name=${{ vars.FRONTEND_DOMAIN }}" >> "$GITHUB_ENV"
          echo "TF_VAR_frontend_bucket_name=${{ vars.FRONTEND_DOMAIN }}" >> "$GITHUB_ENV"

      # ── Promote images (registry-to-registry copy, no rebuild) ───────────
      # crane copies the manifest byte for byte, so the digest in the cloud
      # registry is the GHCR one. `docker buildx imagetools create` wraps even a
      # single-platform image in an OCI index, which Lambda rejects ("image
      # manifest ... media type is not supported"). crane reads the registry
      # logins above from ~/.docker/config.json.
      - uses: imjasonh/setup-crane@v0.7

      - name: Copy images from GHCR
        run: |
          for svc in core-api ai-api; do
            if [ "${{ inputs.cloud }}" = "aws" ]; then dst="${REGISTRY}/travel-ai-${svc}"; else dst="${REGISTRY}/${svc}"; fi
            crane copy "${GHCR_PREFIX}/${svc}:${{ inputs.image_tag }}" "${dst}:${{ inputs.image_tag }}"
            ref="${dst}:${{ inputs.image_tag }}"
            if [ "${{ inputs.cloud }}" = "aws" ]; then
              # Lambda redeploys only when the image URI changes: pin the digest.
              digest=$(crane digest "$ref")
              ref="${dst}@${digest}"
            fi
            echo "TF_VAR_$(echo $svc | tr - _)_image=${ref}" >> "$GITHUB_ENV"
          done

      # ── Terraform ────────────────────────────────────────────────────────
      - uses: hashicorp/setup-terraform@v4

      # TF_INIT_ARGS: AWS passes its partial S3 backend config; GCP has none.
      - run: terraform init -input=false ${TF_INIT_ARGS:-}
      - run: terraform validate
      - run: terraform plan -input=false -out=tfplan

      - name: Apply
        if: inputs.apply
        run: terraform apply -input=false tfplan

      # On Lambda nothing migrates at start (src/backend/docker/entrypoint.sh):
      # the function is asked to, once, after the new image is live.
      - name: Apply database migrations (AWS)
        if: inputs.apply && inputs.cloud == 'aws'
        run: |
          fn=$(terraform output -raw core_api_function_name)
          aws lambda wait function-updated --function-name "$fn"
          aws lambda invoke --function-name "$fn" --cli-binary-format raw-in-base64-out \
            --payload '{"command": "migrate"}' response.json
          cat response.json; echo
          # The Web Adapter may wrap the app's answer as {"statusCode", "body": "<json>"}.
          python3 - <<'PY'
          import json, sys
          data = json.load(open("response.json"))
          if isinstance(data, dict) and "body" in data:
              status_code = int(data.get("statusCode", 0))
              data = json.loads(data["body"]) if isinstance(data["body"], str) else data["body"]
              assert status_code == 200, f"core_api answered {status_code}: {data}"
          assert data.get("status") == "ok", f"migrate did not report ok: {data}"
          print("migrations applied")
          PY
