name: Deploy backend

# Promotes the images built by backend-images.yml (GHCR) into ECR and applies
# infra/aws with them. The functions receive the image *digests* (a mutable tag
# would not redeploy them). There are no migrations to run after the apply:
# core_api keeps its data in DynamoDB (ADR 0023), whose table belongs to Terraform.
#
# Prerequisites (one-off):
#   - The remote Terraform state: apply infra/aws/bootstrap once (state bucket +
#     GitHub OIDC provider + CI role). CI cannot own local state.
#   - The ECR repositories already created (first run only), because the images
#     are copied before Terraform applies:
#       terraform apply -target=aws_ecr_repository.services
#   - Repository secrets (see docs/runbooks/deploy.md and infra/README.md):
#       AWS_REGION, AWS_ROLE_TO_ASSUME (bootstrap output ci_role_arn)
#     Repository variables (Settings → Variables):
#       AWS_TF_STATE_BUCKET (bootstrap output state_bucket),
#       FRONTEND_DOMAIN (TF_VAR_domain_name; the bucket has the same name)
#     Optional repository variables:
#       GRAFANA_CLOUDWATCH_READER (JSON for TF_VAR_grafana_cloud_logs_reader;
#       unset, the plan deletes the Grafana reader role),
#       BUSINESS_EVENTS_ENABLED (true or false; unset means true)
#     Secrets of the `aws` environment (Settings → Environments → aws), only the
#     real secrets: TF_VAR_nvidia_api_key, TF_VAR_google_client_secret.
#     They must match what the state was applied with: a missing one arrives
#     as an empty string and the plan resets that value. Non-secret inputs are
#     defaults in infra/aws/variables.tf.
#
# `apply=false` (default) only plans, so the workflow is safe to try.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag to deploy (a commit SHA from backend-images, or "latest")
        type: string
        default: latest
      apply:
        description: Apply the plan (false = plan only)
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  GHCR_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: aws (${{ inputs.apply && 'apply' || 'plan' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws
    defaults:
      run:
        working-directory: infra/aws
    env:
      TF_VAR_nvidia_api_key: ${{ secrets.TF_VAR_nvidia_api_key }}
      TF_VAR_google_client_secret: ${{ secrets.TF_VAR_google_client_secret }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Registry target
        env:
          STATE_BUCKET: ${{ vars.AWS_TF_STATE_BUCKET }}
          GRAFANA_CLOUD_LOGS_READER: ${{ vars.GRAFANA_CLOUDWATCH_READER || 'null' }}
          BUSINESS_EVENTS_ENABLED_CONTROL: ${{ vars.BUSINESS_EVENTS_ENABLED || 'true' }}
        run: |
          test -n "$STATE_BUCKET" || { echo "::error::Set the repository variable AWS_TF_STATE_BUCKET (infra/aws/bootstrap output state_bucket)"; exit 1; }
          echo "TF_INIT_ARGS=-backend-config=bucket=${STATE_BUCKET} -backend-config=region=${{ secrets.AWS_REGION }}" >> "$GITHUB_ENV"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          echo "TF_VAR_region=${{ secrets.AWS_REGION }}" >> "$GITHUB_ENV"
          echo "TF_VAR_domain_name=${{ vars.FRONTEND_DOMAIN }}" >> "$GITHUB_ENV"
          echo "TF_VAR_frontend_bucket_name=${{ vars.FRONTEND_DOMAIN }}" >> "$GITHUB_ENV"
          # The reader config lives in a repository variable. Unset means null, which
          # plans the deletion of the Grafana reader role: check the plan before applying.
          {
            echo 'TF_VAR_grafana_cloud_logs_reader<<GRAFANA_READER_JSON'
            printf '%s\n' "$GRAFANA_CLOUD_LOGS_READER"
            echo 'GRAFANA_READER_JSON'
          } >> "$GITHUB_ENV"
          case "$BUSINESS_EVENTS_ENABLED_CONTROL" in
            true|false) ;;
            *) echo "::error::BUSINESS_EVENTS_ENABLED must be true or false"; exit 1 ;;
          esac
          echo "TF_VAR_business_events_enabled=$BUSINESS_EVENTS_ENABLED_CONTROL" >> "$GITHUB_ENV"

      # Images are promoted, not rebuilt: crane copies the manifest byte for byte, so
      # the digest in ECR is the GHCR one. `docker buildx imagetools create` wraps even a
      # single-platform image in an OCI index, which Lambda rejects ("image
      # manifest ... media type is not supported"). crane reads the registry
      # logins above from ~/.docker/config.json.
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      # The input reaches the script through the environment, never as script text.
      - name: Copy images from GHCR
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          # backend-images tags each image with its full commit SHA and `latest`
          if ! [[ "$IMAGE_TAG" =~ ^([0-9a-f]{40}|latest)$ ]]; then
            echo "::error::image_tag must be a full commit SHA or latest"
            exit 1
          fi
          for svc in core-api ai-api; do
            dst="${REGISTRY}/travel-ai-${svc}"
            crane copy "${GHCR_PREFIX}/${svc}:${IMAGE_TAG}" "${dst}:${IMAGE_TAG}"
            # Lambda redeploys only when the image URI changes: pin the digest.
            digest=$(crane digest "${dst}:${IMAGE_TAG}")
            echo "TF_VAR_$(echo $svc | tr - _)_image=${dst}@${digest}" >> "$GITHUB_ENV"
          done

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # the minor the devcontainer pins (.devcontainer/Dockerfile): CI and
          # local applies write the same state
          terraform_version: "~1.16.0"

      # TF_INIT_ARGS: the partial S3 backend config set above
      - run: terraform init -input=false ${TF_INIT_ARGS}
      - run: terraform validate
      - run: terraform plan -input=false -out=tfplan

      - name: Apply
        if: inputs.apply
        run: terraform apply -input=false tfplan
