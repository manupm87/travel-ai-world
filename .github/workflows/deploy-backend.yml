name: Deploy backend

# Promotes the images built by backend-images.yml (GHCR) into the chosen
# cloud's registry and applies that cloud's Terraform with them.
#
# Prerequisites (one-off, per cloud):
#   - A remote Terraform state backend configured in infra/<cloud>/
#     (a GCS bucket or S3 bucket); CI cannot own local state.
#   - The container registry already created (first run only), because the
#     images are copied before Terraform applies:
#       terraform apply -target=google_artifact_registry_repository.backend  (GCP)
#       terraform apply -target=aws_ecr_repository.services                 (AWS)
#   - Repository secrets (see docs/runbooks/deploy.md and infra/README.md):
#       GCP: GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
#       AWS: AWS_REGION, AWS_ROLE_TO_ASSUME
#       both: TF_VAR_db_password, TF_VAR_nvidia_api_key, TF_VAR_secret_key,
#             TF_VAR_google_client_id, TF_VAR_google_client_secret,
#             TF_VAR_backend_cors_origins
#
# `apply=false` (default) only plans, so the workflow is safe to try.

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Target cloud
        type: choice
        options: [gcp, aws]
        required: true
      image_tag:
        description: GHCR tag to deploy (a commit SHA from backend-images, or "latest")
        type: string
        default: latest
      apply:
        description: Apply the plan (false = plan only)
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: deploy-backend-${{ inputs.cloud }}
  cancel-in-progress: false

env:
  GHCR_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: ${{ inputs.cloud }} (${{ inputs.apply && 'apply' || 'plan' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.cloud }}
    defaults:
      run:
        working-directory: infra/${{ inputs.cloud }}
    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
      TF_VAR_nvidia_api_key: ${{ secrets.TF_VAR_nvidia_api_key }}
      TF_VAR_secret_key: ${{ secrets.TF_VAR_secret_key }}
      TF_VAR_google_client_id: ${{ secrets.TF_VAR_google_client_id }}
      TF_VAR_google_client_secret: ${{ secrets.TF_VAR_google_client_secret }}
      TF_VAR_backend_cors_origins: ${{ secrets.TF_VAR_backend_cors_origins }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── GCP ──────────────────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        if: inputs.cloud == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: inputs.cloud == 'gcp'
        uses: google-github-actions/setup-gcloud@v2

      - name: Registry target (GCP)
        if: inputs.cloud == 'gcp'
        run: |
          REGION=$(grep -E '^region' terraform.tfvars.example | sed 's/.*"\(.*\)".*/\1/')
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          echo "REGISTRY=${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/travel-ai-images" >> "$GITHUB_ENV"
          echo "TF_VAR_project_id=${{ secrets.GCP_PROJECT_ID }}" >> "$GITHUB_ENV"

      # ── AWS ──────────────────────────────────────────────────────────────
      - name: Authenticate to AWS
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Registry target (AWS)
        if: inputs.cloud == 'aws'
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          echo "TF_VAR_region=${{ secrets.AWS_REGION }}" >> "$GITHUB_ENV"

      # ── Promote images (registry-to-registry copy, no rebuild) ───────────
      - name: Copy images from GHCR
        run: |
          for svc in core-api ai-api; do
            if [ "${{ inputs.cloud }}" = "aws" ]; then dst="${REGISTRY}/travel-ai-${svc}"; else dst="${REGISTRY}/${svc}"; fi
            docker buildx imagetools create \
              --tag "${dst}:${{ inputs.image_tag }}" \
              "${GHCR_PREFIX}/${svc}:${{ inputs.image_tag }}"
            echo "TF_VAR_$(echo $svc | tr - _)_image=${dst}:${{ inputs.image_tag }}" >> "$GITHUB_ENV"
          done

      # ── Terraform ────────────────────────────────────────────────────────
      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -out=tfplan

      - name: Apply
        if: inputs.apply
        run: terraform apply -input=false tfplan
