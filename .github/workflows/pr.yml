name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Import validation
        run: uv run python -c "from app.main import app; print('Backend imports OK')"

      - name: Pytest
        env:
          DB_ENGINE: postgresql
          DB_SERVER: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: fastapi_db
          SECRET_KEY: ci-test-secret-key
        run: uv run pytest -q

  frontend:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (static export)
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
        run: npm run test:e2e:static

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /travel-ai-world
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
        run: npm run build
