name: PR Checks

on:
  pull_request:
    branches: [main]

# The default token is read-only; paths-filter lists the PR's files through the API.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.filter.outputs.common }}
      core: ${{ steps.filter.outputs.core }}
      ai: ${{ steps.filter.outputs.ai }}
      corpus: ${{ steps.filter.outputs.corpus }}
      bench: ${{ steps.filter.outputs.bench }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      stack: ${{ steps.filter.outputs.stack }}
      infra: ${{ steps.filter.outputs.infra }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common:
              - 'src/backend/libs/**'
              - 'src/backend/pyproject.toml'
              - 'src/backend/uv.lock'
              - '.github/**'
            core:
              - 'src/backend/services/core_api/**'
              - 'src/backend/libs/**'
              - 'src/backend/pyproject.toml'
              - 'src/backend/uv.lock'
              - '.github/**'
            ai:
              - 'src/backend/services/ai_api/**'
              - 'src/backend/libs/**'
              - 'src/backend/pyproject.toml'
              - 'src/backend/uv.lock'
              - '.github/**'
            corpus:
              - 'src/backend/tools/city_corpus/**'
              - 'src/backend/pyproject.toml'
              - 'src/backend/uv.lock'
              - '.github/**'
            bench:
              - 'src/backend/tools/vector_store_bench/**'
              - 'src/backend/pyproject.toml'
              - 'src/backend/uv.lock'
              - '.github/**'
            backend:
              - 'src/backend/**'
              - 'scripts/**'
              - 'justfile'
              - '.github/**'
            frontend:
              - 'src/frontend/**'
              - 'justfile'
              - '.github/**'
            stack:
              - 'src/**'
              - 'justfile'
              - '.github/**'
            infra:
              - 'infra/**'
              - '.github/**'
            docs:
              - '**/*.md'
              - 'scripts/check_docs.py'
              - 'justfile'
              - '.github/**'

  backend-lint:
    name: Backend lint & format
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - uses: extractions/setup-just@v2
      - run: just lint-backend

  backend-common:
    name: travel_common tests
    needs: changes
    if: needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/backend/libs/travel_common
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: uv run pytest -q

  backend-core:
    name: core_api tests
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/backend/services/core_api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_SERVER: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: fastapi_db
      SECRET_KEY: ci-test-secret-key-that-is-long-enough-32b
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - name: Import validation
        run: uv run python -c "from core_api.main import app; print('core_api imports OK')"
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest -q

  backend-ai:
    name: ai_api tests
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/backend/services/ai_api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - name: Import validation
        run: uv run python -c "from ai_api.main import app; print('ai_api imports OK')"
      - run: uv run pytest -q

  backend-corpus:
    name: city_corpus tests
    needs: changes
    if: needs.changes.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/backend/tools/city_corpus
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: uv run pytest -q

  backend-bench:
    name: vector_store_bench tests
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/backend/tools/vector_store_bench
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: uv run pytest -q

  docker-build:
    name: Docker image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: [core_api, ai_api]
    uses: ./.github/workflows/_build-image.yml
    with:
      service: ${{ matrix.service }}
      push: false

  contracts:
    name: API contracts (OpenAPI → TypeScript)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - uses: ./.github/actions/setup-frontend
      - uses: extractions/setup-just@v2
      - name: OpenAPI documents and generated types match the code
        run: just contracts-check

  # The Compose stack as deployed: the frontend export and both APIs on one
  # origin (:8080), routed by nginx the way CloudFront routes in production.
  # The devcontainer has no Docker, so this job is where the stack is proven:
  # the curl checks of TRA-127, then the seed and the signed-in Playwright
  # suite of TRA-131 (a local token minted in the container, no Google).
  # Both images build in ~40 s (the uv cache layer), so no GHA layer cache.
  e2e-stack:
    name: Compose stack e2e (one origin, seeded, signed in)
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # `just build-stack` reads .env.local when present; CI has none, so the
      # Google client id (a build-time public value) comes from here.
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
      E2E_EMAIL: e2e@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - uses: extractions/setup-just@v2

      - name: Service .env files from the templates (throwaway values)
        working-directory: src/backend/services
        run: |
          key=$(openssl rand -hex 32)
          for service in core_api ai_api; do
            sed -e "s|^SECRET_KEY=.*|SECRET_KEY=\"$key\"|" \
                -e 's|^GOOGLE_CLIENT_ID=.*|GOOGLE_CLIENT_ID="placeholder"|' \
                -e 's|^NVIDIA_API_KEY=.*|NVIDIA_API_KEY="placeholder"|' \
                -e 's|^DB_PASSWORD=.*|DB_PASSWORD="postgres"|' \
                -e 's|^DB_NAME=.*|DB_NAME="travel_ai_world"|' \
                "$service/.env.example" > "$service/.env"
          done
          grep -c '^SECRET_KEY="[0-9a-f]\{64\}"$' core_api/.env ai_api/.env

      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Export for the Compose origin, then build and start the stack
        run: just stack-up

      - name: Wait for the proxy to route to core_api
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "core_api never answered through the proxy" >&2
          exit 1

      - name: Acceptance criteria (TRA-127)
        run: |
          set -euo pipefail
          fetch() { # fetch <path> <expected status> <expected content-type substring> <expected body substring>
            local status
            status=$(curl -sS -o body -w '%{http_code}' -D headers "http://localhost:8080$1")
            echo "GET $1 -> $status"
            test "$status" = "$2"
            grep -i "^content-type:.*$3" headers >/dev/null
            grep -q "$4" body
          }
          fetch /                    200 text/html         '<html'
          fetch /dashboard/          200 text/html         '<html'
          fetch /dashboard           200 text/html         '<html'
          fetch /api/v1/health/      200 application/json  '"status"'
          fetch /api/v1/ai/health/   200 application/json  '"status"'
          fetch /does-not-exist/     404 text/html         'on the map'
          fetch /api/v1/trips/       401 application/json  '"detail"'

      # `next build` recreates out/; without the proxy recreate in `just stack-up`
      # nginx would keep the unlinked directory and 404 on every page from here on.
      - name: A second `just stack-up` still serves the rebuilt export
        run: |
          just stack-up
          # The recreated proxy needs a moment before nginx listens; retry like the first wait.
          for i in $(seq 1 30); do
            if status=$(curl -sS -o body -w '%{http_code}' http://localhost:8080/); then break; fi
            sleep 1
          done
          echo "GET / -> ${status:-no answer}"
          test "${status:-}" = "200" && grep -q '<html' body

      # Seed and token run inside the core_api container: it already holds
      # SECRET_KEY and the database, so the runner needs no Python toolchain.
      # `python -m core_api.devtools token` is exactly what `just dev-token` runs.
      - name: Seed the demo trips and mint a local token for that account (TRA-131)
        working-directory: src/backend
        run: |
          set -euo pipefail
          compose="docker compose --env-file services/core_api/.env"
          $compose exec -T core_api /app/entrypoint.sh seed "$E2E_EMAIL"
          token=$($compose exec -T core_api python -m core_api.devtools token "$E2E_EMAIL")
          echo "::add-mask::$token"
          test "$(printf '%s' "$token" | wc -l)" = 0
          echo "E2E_TOKEN=$token" >> "$GITHUB_ENV"
          # The token must open the API through the proxy before any browser tries it:
          # pipefail makes a 401 from curl fail the step, and the count catches an empty list.
          count=$(curl -fsS -H "Authorization: Bearer $token" http://localhost:8080/api/v1/trips/ | grep -o '"title"' | wc -l)
          echo "GET /api/v1/trips/ with the token -> $count title(s)"
          test "$count" -ge 1

      - name: E2E tests against the stack (smoke, prerender and the signed-in trips)
        run: just test-e2e-stack

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stack
          path: src/frontend/playwright-report/
          retention-days: 7

      - name: Container logs
        if: failure()
        working-directory: src/backend
        run: docker compose --env-file services/core_api/.env logs --no-color

      - name: Tear down
        if: always()
        working-directory: src/backend
        run: docker compose --env-file services/core_api/.env down -v

  infra:
    name: Terraform (${{ matrix.cloud }})
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cloud: [gcp, aws, aws/bootstrap]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: extractions/setup-just@v2
      - run: just infra-fmt-check
      - run: just infra-validate ${{ matrix.cloud }}

  docs:
    name: Docs hygiene
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Required files, ADR index, just recipes, relative links
        run: just docs-check
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !src/frontend/out/**
      - name: External links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: true

  frontend:
    name: Frontend lint, tests & build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - uses: extractions/setup-just@v2

      - name: Lint
        run: just lint-frontend

      - name: Unit tests
        run: just test-frontend

      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: E2E tests (static export)
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
        run: just test-e2e-static

      - name: Build as deployed (GitHub Pages base path)
        env:
          # Project Pages URL is https://<owner>.github.io/<repo>/: the base path is the repo name.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
        run: just build
