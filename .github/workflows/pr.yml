name: PR Checks

on:
  pull_request:
    branches: [main]

# The default token is read-only; paths-filter lists the PR's files through the API.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.filter.outputs.common }}
      core: ${{ steps.filter.outputs.core }}
      ai: ${{ steps.filter.outputs.ai }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            common:
              - 'src/backend/libs/**'
              - 'src/backend/pyproject.toml'
              - 'src/backend/uv.lock'
              - '.github/**'
            core:
              - 'src/backend/services/core_api/**'
              - 'src/backend/libs/**'
              - 'src/backend/pyproject.toml'
              - 'src/backend/uv.lock'
              - '.github/**'
            ai:
              - 'src/backend/services/ai_api/**'
              - 'src/backend/libs/**'
              - 'src/backend/pyproject.toml'
              - 'src/backend/uv.lock'
              - '.github/**'
            backend:
              - 'src/backend/**'
              - 'scripts/**'
              - 'justfile'
              - '.github/**'
            frontend:
              - 'src/frontend/**'
              - 'justfile'
              - '.github/**'
            infra:
              - 'infra/**'
              - '.github/**'
            docs:
              - '**/*.md'
              - 'scripts/check_docs.py'
              - 'justfile'
              - '.github/**'

  backend-lint:
    name: Backend lint & format
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - uses: extractions/setup-just@v4
      - run: just lint-backend

  backend-common:
    name: travel_common tests
    needs: changes
    if: needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/backend/libs/travel_common
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - run: uv run pytest -q

  backend-core:
    name: core_api tests
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/backend/services/core_api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_SERVER: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: fastapi_db
      SECRET_KEY: ci-test-secret-key-that-is-long-enough-32b
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - name: Import validation
        run: uv run python -c "from core_api.main import app; print('core_api imports OK')"
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest -q

  backend-ai:
    name: ai_api tests
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/backend/services/ai_api
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - name: Import validation
        run: uv run python -c "from ai_api.main import app; print('ai_api imports OK')"
      - run: uv run pytest -q

  docker-build:
    name: Docker image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: [core_api, ai_api]
    uses: ./.github/workflows/_build-image.yml
    with:
      service: ${{ matrix.service }}
      push: false

  contracts:
    name: API contracts (OpenAPI → TypeScript)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - uses: ./.github/actions/setup-frontend
      - uses: extractions/setup-just@v4
      - name: OpenAPI documents and generated types match the code
        run: just contracts-check

  infra:
    name: Terraform (${{ matrix.cloud }})
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cloud: [gcp, aws]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - uses: extractions/setup-just@v4
      - run: just infra-fmt-check
      - run: just infra-validate ${{ matrix.cloud }}

  docs:
    name: Docs hygiene
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: Required files, ADR index, just recipes, relative links
        run: just docs-check
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !src/frontend/out/**
      - name: External links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: true

  frontend:
    name: Frontend lint, tests & build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - uses: extractions/setup-just@v4

      - name: Lint
        run: just lint-frontend

      - name: Unit tests
        run: just test-frontend

      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: E2E tests (static export)
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
        run: just test-e2e-static

      - name: Build as deployed (GitHub Pages base path)
        env:
          # Project Pages URL is https://<owner>.github.io/<repo>/: the base path is the repo name.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
        run: just build
