name: PR Checks

on:
  pull_request:
    branches: [main]

# The default token is read-only; paths-filter lists the PR's files through the API.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.filter.outputs.common }}
      core: ${{ steps.filter.outputs.core }}
      ai: ${{ steps.filter.outputs.ai }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common:
              - 'src/backend/libs/**'
              - 'src/backend/pyproject.toml'
              - 'src/backend/uv.lock'
              - '.github/**'
            core:
              - 'src/backend/services/core_api/**'
              - 'src/backend/libs/**'
              - 'src/backend/pyproject.toml'
              - 'src/backend/uv.lock'
              - '.github/**'
            ai:
              - 'src/backend/services/ai_api/**'
              - 'src/backend/libs/**'
              - 'src/backend/pyproject.toml'
              - 'src/backend/uv.lock'
              - '.github/**'
            backend:
              - 'src/backend/**'
              - '.github/**'
            frontend:
              - 'src/frontend/**'
              - '.github/**'
            docs:
              - '**/*.md'
              - 'scripts/check_docs.py'
              - '.github/**'

  backend-lint:
    name: Backend lint & format
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  backend-common:
    name: travel_common tests
    needs: changes
    if: needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend/libs/travel_common
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - run: uv run pytest -q

  backend-core:
    name: core_api tests
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend/services/core_api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_SERVER: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: fastapi_db
      SECRET_KEY: ci-test-secret-key-that-is-long-enough-32b
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - name: Import validation
        run: uv run python -c "from core_api.main import app; print('core_api imports OK')"
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest -q

  backend-ai:
    name: ai_api tests
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend/services/ai_api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - name: Import validation
        run: uv run python -c "from ai_api.main import app; print('ai_api imports OK')"
      - run: uv run pytest -q

  docker-build:
    name: Docker image (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [core_api, ai_api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: src/backend/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          load: true
          tags: ${{ matrix.service }}:pr
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Image imports its app
        run: docker run --rm --entrypoint python -e SECRET_KEY=x ${{ matrix.service }}:pr -c "from ${{ matrix.service }}.main import app; print('ok')"
      - name: Image serves its health endpoint
        if: matrix.service == 'ai_api'
        run: |
          docker run -d --name ai -p 8000:8000 -e SECRET_KEY=ci-secret ai_api:pr
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/api/v1/ai/health/ && break
            sleep 1
          done
          docker logs ai
          curl -fsS http://localhost:8000/api/v1/ai/health/

  contracts:
    name: API contracts (OpenAPI → TypeScript)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
      - name: OpenAPI documents match the code
        working-directory: src/backend
        run: uv run python scripts/export_openapi.py --check
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Generated TypeScript types match the documents
        working-directory: src/frontend
        run: npm run types:check

  docs:
    name: Docs hygiene
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files, ADR index, just recipes, relative links
        run: python3 scripts/check_docs.py
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !src/frontend/out/**
      - name: External links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: true

  frontend:
    name: Frontend lint, tests & build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (static export)
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
        run: npm run test:e2e:static

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /travel-ai-world
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
        run: npm run build
