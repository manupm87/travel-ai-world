# Keep actions, npm and Python dependencies current with one PR per ecosystem per week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript 6 breaks `npm run types:generate`: openapi-typescript 7.x
      # declares `typescript: "^5.x"` as its peer range (Dependabot PR #58 failed
      # on it). Revisit when openapi-typescript 8 supports typescript 6.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node must track the Node runtime major we build and deploy on:
      # 24, pinned in src/frontend/.nvmrc and in package.json `engines`.
      # Bump this by hand together with the runtime, never on its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint 10 is not usable through eslint-config-next yet: eslint-plugin-react
      # (7.37.5, the latest published) still caps its peer range at `^9.7`, so linting
      # dies with "TypeError: Error while loading rule 'react/display-name':
      # contextOrFilename.getFilename is not a function" (Dependabot PR #59, retried
      # and reproduced in TRA-195). eslint-plugin-import and eslint-plugin-jsx-a11y
      # cap at ^9 too. Revisit when eslint-config-next ships eslint-10-ready plugins.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directory: /src/backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
