# Keep actions, npm and Python dependencies current with one PR per ecosystem per week.
version: 2
updates:
  - package-ecosystem: github-actions
    # the composite actions pin their own versions: `/` alone does not scan them
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript 6+ breaks `npm run types:generate`: openapi-typescript 7.x
      # declares `typescript: "^5.x"` as its peer range.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node must track the Node runtime major we build and deploy on:
      # 24, pinned in src/frontend/.nvmrc and in package.json `engines`.
      # Bump this by hand together with the runtime, never on its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint 10 breaks linting through eslint-config-next: eslint-plugin-react 7.37.5
      # caps its peer range at `^9.7` and the rule 'react/display-name' fails with
      # "contextOrFilename.getFilename is not a function". eslint-plugin-import and
      # eslint-plugin-jsx-a11y cap at ^9 too.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directory: /src/backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
