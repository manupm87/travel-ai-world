name: Set up uv workspace
description: Install uv, the Python pinned in src/backend/.python-version and the workspace dependencies (cached).

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: src/backend/uv.lock

    - name: Set up Python
      shell: bash
      working-directory: src/backend
      run: uv python install   # version from .python-version

    - name: Install workspace
      shell: bash
      working-directory: src/backend
      run: uv sync --frozen --all-packages
