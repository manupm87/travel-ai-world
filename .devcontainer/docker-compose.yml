# Devcontainer stack: your terminal + PostgreSQL. Nothing else.
#
# The services are NOT started here on purpose: run them from the container
# terminal with `just dev-core`, `just dev-ai` and `just dev-frontend` (hot
# reload, logs in front of you, VS Code debugger attachable). The
# production-like stack (built images + nginx) stays in src/backend/docker-compose.yml.
#
# src/backend/.venv, src/frontend/node_modules and src/frontend/.next live in named volumes
# so the host's copies are never touched (they contain platform-specific
# binaries). post-create.sh fixes their ownership on first run.
#
# AWS: `aws`, `terraform` and `crane` are installed; credentials come from IAM
# Identity Center (`just aws-login`), never from access keys. ~/.aws is a named
# volume so the SSO token cache survives rebuilds (the host's ~/.aws is not mounted).
#
# Agent CLIs: Claude Code is always installed; the others come from the
# EXTRA_AGENT_CLIS build arg (override with DEVCONTAINER_EXTRA_AGENT_CLIS on the
# host). Their logins and settings live in named volumes, so they survive
# "Rebuild Container".

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        EXTRA_AGENT_CLIS: ${DEVCONTAINER_EXTRA_AGENT_CLIS-@openai/codex @google/gemini-cli @github/copilot}
    init: true
    volumes:
      - ..:/workspace:cached
      - backend_venv:/workspace/src/backend/.venv
      - frontend_node_modules:/workspace/src/frontend/node_modules
      - frontend_next:/workspace/src/frontend/.next
      - agent_claude:/home/vscode/.claude
      - agent_codex:/home/vscode/.codex
      - agent_gemini:/home/vscode/.gemini
      - agent_copilot:/home/vscode/.copilot
      - aws_config:/home/vscode/.aws
      - shell_history:/commandhistory
    command: sleep infinity
    environment:
      # Override the DB_* keys of src/backend/services/core_api/.env so core_api,
      # alembic and the tests always talk to the `db` service below.
      # (Environment variables win over .env in pydantic-settings.)
      DB_SERVER: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: travel_ai_world
      # Playwright's Chromium is installed by post-create.sh into this path.
      PLAYWRIGHT_BROWSERS_PATH: /home/vscode/.cache/ms-playwright
      # SSO profile from .devcontainer/aws-config.example (copied to ~/.aws/config
      # by post-create.sh). The region lives in the profile.
      AWS_PROFILE: travel-ai-world
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel_ai_world
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_ai_world"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend_venv:
  frontend_node_modules:
  frontend_next:
  agent_claude:
  agent_codex:
  agent_gemini:
  agent_copilot:
  aws_config:
  shell_history:
  postgres_data:
