version: "3.9"

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    networks:
      - devnet
    depends_on:
      - backend
      - frontend
      - db

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    working_dir: /workspace/backend
    volumes:
      - ..:/workspace
    command: uv run fastapi dev app/main.py
    ports:
      - "8000:8000"
    environment:
      DB_SERVER: db
      DB_PORT: 5432
      DB_USER: travel
      DB_PASSWORD: travel
      DB_NAME: travel_ai_world
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"]'
      FRONTEND_URL: http://127.0.0.1:3000
      # NVIDIA_API_KEY intentionally NOT set here — loaded from backend/.env
      # (mounted via the volume) so it's never overridden by an empty host var.
    networks:
      - devnet
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20
    working_dir: /workspace/frontend
    volumes:
      - ..:/workspace
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    networks:
      - devnet

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel_ai_world
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_ai_world"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devnet

networks:
  devnet:

volumes:
  postgres_data:
 