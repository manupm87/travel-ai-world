# Overlay paths are relative to the FIRST file: src/backend/docker-compose.yml.
services:
  core_api:
    environment:
      METRICS_ENABLED: "true"
      METRICS_CITY_SLUGS: '["berlin", "bologna", "budapest", "los-angeles", "madrid", "miami"]'
      WEB_CONCURRENCY: "1"
    # Replace the base binding: the unauthenticated scrape is local only.
    ports: !override
      - "127.0.0.1:8000:8000"

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [metrics]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ../../infra/aws/metric/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - metrics_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      core_api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    profiles: [metrics]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/business.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../infra/aws/metric/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../infra/aws/metric/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  metrics_data:
  grafana_data:
